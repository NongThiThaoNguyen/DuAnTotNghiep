<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <!-- Decorative circles -->
  <circle cx="120" cy="80" r="140" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="700" cy="380" r="180" fill="#FFFFFF" opacity="0.08"/>
  
  <g filter="url(#shadow)" transform="translate(260, 100)">
    <!-- Left Page -->
    <path d="M 20 50 Q 140 30 260 50 L 260 270 Q 140 250 20 270 Z" fill="url(#bookGrad)"/>
    <!-- Right Page -->
    <path d="M 260 50 Q 380 30 500 50 L 500 270 Q 380 250 260 270 Z" fill="url(#bookGrad)"/>
    <!-- Book Spine -->
    <path d="M 255 48 L 265 48 L 265 272 L 255 272 Z" fill="#D97706"/>
    
    <!-- Text Lines Left -->
    <line x1="50" y1="90" x2="220" y2="90" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <line x1="50" y1="120" x2="200" y2="120" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="145" x2="230" y2="145" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="170" x2="190" y2="170" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="195" x2="210" y2="195" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Text Lines Right -->
    <line x1="300" y1="90" x2="470" y2="90" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <line x1="300" y1="120" x2="450" y2="120" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="145" x2="480" y2="145" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="170" x2="430" y2="170" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="195" x2="460" y2="195" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Bookmark -->
    <path d="M 260 40 L 260 160 L 280 145 L 300 160 L 300 40 Z" fill="#EF4444"/>
  </g>
  
  <text x="400" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">READING SKILLS</text>
</svg>
