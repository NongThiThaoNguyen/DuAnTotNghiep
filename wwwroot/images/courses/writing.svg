<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <filter id="shadowW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14532D" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgGradW)"/>
  <circle cx="150" cy="100" r="150" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="650" cy="350" r="160" fill="#FFFFFF" opacity="0.08"/>
  
  <g filter="url(#shadowW)" transform="translate(250, 70)">
    <!-- Clipboard / Paper -->
    <rect x="50" y="30" width="220" height="280" rx="16" fill="#FFFFFF"/>
    <!-- Lines on paper -->
    <line x1="80" y1="80" x2="240" y2="80" stroke="#166534" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="115" x2="220" y2="115" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="145" x2="240" y2="145" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="175" x2="200" y2="175" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="205" x2="230" y2="205" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="235" x2="190" y2="235" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Pen -->
    <g transform="rotate(-35 220 180)">
      <rect x="200" y="50" width="24" height="180" rx="6" fill="#F59E0B"/>
      <polygon points="200,230 224,230 212,265" fill="#1E293B"/>
      <rect x="200" y="50" width="24" height="25" fill="#E5E7EB"/>
    </g>
  </g>
  
  <text x="400" y="390" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">WRITING SKILLS</text>
</svg>
